<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Terminal</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
a{text-decoration:none;color:inherit}
body{font-family:'Courier New',Courier,monospace;background:#070710;color:#c8d0e0;min-height:100vh}

#header{background:#08080f;border-bottom:1px solid #1c1c30;padding:10px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{color:#00e676;font-size:13px;font-weight:700;letter-spacing:4px;margin-right:4px;white-space:nowrap}
#ticker-input{background:#101020;border:1px solid #1c1c30;color:#c8d0e0;font-family:inherit;font-size:13px;padding:5px 10px;border-radius:3px;outline:none;width:88px;letter-spacing:2px;text-transform:uppercase}
#ticker-input:focus{border-color:#00e676}
#fetch-btn{background:#00e676;color:#060610;border:none;font-family:inherit;font-size:10px;font-weight:700;padding:6px 14px;border-radius:3px;cursor:pointer;letter-spacing:2px}
#fetch-btn:hover{background:#33ff99}
#header-status{font-size:11px;color:#505068}

#tabs{background:#08080f;border-bottom:1px solid #1c1c30;padding:0 14px;display:flex}
.tab-btn{padding:10px 14px;font-size:10px;letter-spacing:2px;cursor:pointer;border:none;background:none;color:#505068;border-bottom:2px solid transparent;font-family:inherit}
.tab-btn.active{color:#00e676;border-bottom:2px solid #00e676}

#content{padding:16px 18px}
.tab-panel{display:none}.tab-panel.active{display:block}
.msg{color:#505068;font-size:11px;padding:30px;text-align:center;letter-spacing:2px}
.err-box{color:#ff4466;font-size:11px;padding:12px 14px;background:#1a0008;border:1px solid #330011;border-radius:4px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.retry-btn{color:#00e676;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;white-space:nowrap}
.hidden{display:none!important}

/* overview */
.card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:14px 18px;margin-bottom:12px}
.card-label{font-size:9px;color:#505068;letter-spacing:3px;margin-bottom:8px}
.price-big{font-size:36px;color:#c8d0e0;font-weight:300}
.price-chg{font-size:16px;margin-left:14px}
.up{color:#00e676}.down{color:#ff4466}
#stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat-card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:10px 12px}
.stat-lbl{font-size:9px;color:#505068;letter-spacing:2px;margin-bottom:4px}
.stat-val{font-size:14px;color:#c8d0e0}

/* chart toolbar */
#chart-toolbar{display:flex;align-items:center;gap:5px;margin-bottom:10px;padding:6px 10px;background:#0a0a14;border:1px solid #1c1c30;border-radius:4px;flex-wrap:wrap}
.tv-sep{width:1px;height:16px;background:#1c1c30;margin:0 3px;flex-shrink:0}
.tv-btn{padding:3px 10px;font-size:10px;font-family:inherit;cursor:pointer;border-radius:2px;border:1px solid transparent;background:transparent;color:#505068;letter-spacing:.5px;transition:all .12s;white-space:nowrap}
.tv-btn:hover{color:#c8d0e0;background:#1c1c30}
.tv-btn.active{color:#00e676;background:#003316;border-color:#00e676}
#tv-outer{height:540px;border-radius:4px;overflow:hidden;border:1px solid #1c1c30}
#tv-outer iframe{display:block}

/* news */
.news-card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:14px;margin-bottom:10px}
.news-meta{font-size:10px;color:#505068;margin-bottom:6px}
.news-title{font-size:13px;color:#c8d0e0;line-height:1.5;margin-bottom:6px}
.news-desc{font-size:11px;color:#505068;line-height:1.7;margin-bottom:7px}
.news-link{font-size:9px;color:#00e676;letter-spacing:1px;padding:2px 8px;border:1px solid #003316;border-radius:2px}

/* filings */
.fil-head{font-size:9px;color:#505068;letter-spacing:2px;margin-bottom:14px}
.fil-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #111120}
.fbadge{font-size:9px;padding:2px 8px;border-radius:2px;letter-spacing:1px;font-weight:700;min-width:52px;text-align:center;white-space:nowrap}
.fdesc{font-size:11px;color:#c8d0e0;flex:1}
.fdate{font-size:10px;color:#505068;min-width:84px}
.flink{font-size:9px;color:#00e676;letter-spacing:1px;padding:2px 8px;border:1px solid #003316;border-radius:2px;white-space:nowrap}
</style>
</head>
<body>

<div id="header">
  <span class="logo">◈ TERMINAL</span>
  <input id="ticker-input" type="text" value="AAPL" maxlength="10" placeholder="TICKER" autocomplete="off" spellcheck="false"/>
  <button id="fetch-btn">FETCH →</button>
  <span id="header-status"></span>
</div>

<div id="tabs">
  <button class="tab-btn active" data-tab="overview">OVERVIEW</button>
  <button class="tab-btn" data-tab="chart">CHART</button>
  <button class="tab-btn" data-tab="news">NEWS</button>
  <button class="tab-btn" data-tab="filings">FILINGS</button>
</div>

<div id="content">

  <!-- OVERVIEW -->
  <div id="tab-overview" class="tab-panel active">
    <div id="ov-load" class="msg">⬡ FETCHING PRICE DATA...</div>
    <div id="ov-err" class="err-box hidden"><span id="ov-et"></span><button class="retry-btn" id="ov-retry">RETRY</button></div>
    <div id="ov-body" class="hidden">
      <div class="card">
        <div class="card-label" id="price-lbl">LAST PRICE</div>
        <div><span class="price-big" id="price-val">—</span><span class="price-chg" id="price-chg-el">—</span></div>
      </div>
      <div id="stats-grid"></div>
    </div>
  </div>

  <!-- CHART — powered by TradingView (fast, candlestick, drawing tools built in) -->
  <div id="tab-chart" class="tab-panel">
    <div id="ch-load" class="msg">⬡ LOADING CHART...</div>
    <div id="ch-err" class="err-box hidden"><span id="ch-et"></span><button class="retry-btn" id="ch-retry">RETRY</button></div>
    <div id="ch-body" class="hidden">
      <div id="chart-toolbar">
        <span style="font-size:9px;color:#505068;letter-spacing:2px">CANDLE</span>
        <div class="tv-sep"></div>
        <div id="period-btns" style="display:flex;gap:3px"></div>
        <div class="tv-sep"></div>
        <span style="font-size:9px;color:#505068;letter-spacing:1px">✏ Drawing tools & indicators inside the chart →</span>
      </div>
      <div id="tv-outer">
        <!-- TradingView widget injected here -->
      </div>
    </div>
  </div>

  <!-- NEWS -->
  <div id="tab-news" class="tab-panel">
    <div id="nw-idle" class="msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    <div id="nw-load" class="msg hidden">⬡ FETCHING NEWS...</div>
    <div id="nw-err" class="err-box hidden"><span id="nw-et"></span><button class="retry-btn" id="nw-retry">RETRY</button></div>
    <div id="nw-body"></div>
  </div>

  <!-- FILINGS -->
  <div id="tab-filings" class="tab-panel">
    <div id="fi-idle" class="msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    <div id="fi-load" class="msg hidden">⬡ QUERYING SEC EDGAR...</div>
    <div id="fi-err" class="err-box hidden"><span id="fi-et"></span><button class="retry-btn" id="fi-retry">RETRY</button></div>
    <div id="fi-body"></div>
  </div>

</div>

<script>
// ═══════════════════════════════════════════════════════════
// PERIODS
// ═══════════════════════════════════════════════════════════
const PERIODS = [
  { label:'1D', tv:'D', tip:'1 candle = 1 trading day'  },
  { label:'1W', tv:'W', tip:'1 candle = 1 week'         },
  { label:'1M', tv:'M', tip:'1 candle = 1 month'        },
];
const FORMS  = ['10-K','10-Q','8-K','DEF 14A','4','S-1','S-3'];
const FORM_D = {'10-K':'Annual Report','10-Q':'Quarterly Report','8-K':'Current Report',
                'DEF 14A':'Proxy Statement','4':'Insider Trade','S-1':'IPO Registration','S-3':'Shelf Registration'};
const FORM_C = {'10-K':'#4488ff','10-Q':'#00bcd4','8-K':'#ff9500',
                'DEF 14A':'#aa44ff','4':'#ff4466','S-1':'#00e676','S-3':'#44cc88'};

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
const S = {
  ticker:'AAPL', pidx:0, tab:'overview',
  chartLoaded:false, newsLoaded:false, filingsLoaded:false,
  tvScriptLoaded:false,
};

// ═══════════════════════════════════════════════════════════
// DOM HELPERS
// ═══════════════════════════════════════════════════════════
const $    = id => document.getElementById(id);
const show = id => $( id)?.classList.remove('hidden');
const hide = id => $( id)?.classList.add('hidden');
const html = (id, h) => { const e=$(id); if(e) e.innerHTML=h; };

function fmt(v, d=2) {
  if (v==null||v===''||isNaN(+v)) return '—';
  return (+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtB(n) {
  n=+n; if(!isFinite(n)) return '—';
  if(n>=1e12) return(n/1e12).toFixed(2)+'T';
  if(n>=1e9)  return(n/1e9).toFixed(2)+'B';
  if(n>=1e6)  return(n/1e6).toFixed(2)+'M';
  return n.toLocaleString();
}

// ═══════════════════════════════════════════════════════════
// FETCH WITH HARD TIMEOUT
//
// KEY FIX: Yahoo Finance sometimes accepts the TCP connection
// but never sends a response (throttling). Without a timeout,
// the browser hangs for 60-90 seconds. With a 5s timeout,
// worst case is 5 seconds total across all attempts.
// ═══════════════════════════════════════════════════════════
function fetchTimeout(url, ms=5000) {
  const ctrl = new AbortController();
  const tid  = setTimeout(() => ctrl.abort(), ms);
  return fetch(url, {signal: ctrl.signal})
    .then(r  => { clearTimeout(tid); return r; })
    .catch(e => { clearTimeout(tid); throw e; });
}

// ═══════════════════════════════════════════════════════════
// YAHOO FINANCE — fires all sources SIMULTANEOUSLY,
// takes whichever answers first (Promise.any).
// With 5s timeout: worst-case wait = 5 seconds (not 60+).
// ═══════════════════════════════════════════════════════════
async function yfFetch(sym, iv, range) {
  const path = `/v8/finance/chart/${encodeURIComponent(sym)}?interval=${iv}&range=${range}&includePrePost=false`;
  const YF1  = 'https://query1.finance.yahoo.com' + path;
  const YF2  = 'https://query2.finance.yahoo.com' + path;

  const tryDirect = async url => {
    const r = await fetchTimeout(url, 5000);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    if (!j?.chart?.result?.[0]) throw new Error('empty');
    return j;
  };

  const tryProxy = async url => {
    const r = await fetchTimeout(url, 5000);
    if (!r.ok) throw new Error('HTTP '+r.status);
    const j = await r.json();
    // allorigins wraps response: { contents: "<json>" }
    const data = j.contents ? JSON.parse(j.contents) : j;
    if (!data?.chart?.result?.[0]) throw new Error('empty');
    return data;
  };

  try {
    return await Promise.any([
      tryDirect(YF1),
      tryDirect(YF2),
      tryProxy('https://corsproxy.io/?' + encodeURIComponent(YF1)),
      tryProxy('https://api.allorigins.win/get?url=' + encodeURIComponent(YF1)),
    ]);
  } catch(_) {
    throw new Error('Could not load data for "'+sym+'". Check the ticker symbol and try again.');
  }
}

// ═══════════════════════════════════════════════════════════
// OVERVIEW
// ═══════════════════════════════════════════════════════════
async function loadPrice(sym) {
  show('ov-load'); hide('ov-err'); hide('ov-body');
  $('header-status').textContent = 'FETCHING...';
  try {
    const json = await yfFetch(sym, '1d', '5d');  // small range = faster
    const res  = json.chart?.result?.[0];
    if (!res) throw new Error(`No data for "${sym}"`);

    const meta   = res.meta;
    const q0     = res.indicators?.quote?.[0] || {};
    const closes = (q0.close || []).filter(c => c!=null);
    const highs  = (q0.high  || []).filter(h => h!=null);
    const lows   = (q0.low   || []).filter(l => l!=null);

    const price  = meta.regularMarketPrice ?? closes[closes.length-1];
    const prev   = meta.chartPreviousClose ?? meta.previousClose ?? price;
    const chg    = price - prev;
    const chgPct = prev ? (chg/prev)*100 : 0;

    $('price-val').textContent  = `$${fmt(price)}`;
    $('price-lbl').textContent  = `LAST PRICE · ${meta.exchangeName||''}`;
    const ce = $('price-chg-el');
    ce.textContent = `${chg>=0?'+':''}${fmt(chg)} (${chg>=0?'+':''}${fmt(chgPct)}%)`;
    ce.className   = 'price-chg '+(chg>=0?'up':'down');

    // Also fetch 1y for 52w high/low
    let hi52='—', lo52='—';
    try {
      const jy   = await yfFetch(sym,'1d','1y');
      const ry   = jy.chart?.result?.[0];
      const q1y  = ry?.indicators?.quote?.[0] || {};
      const ch1y = (q1y.high||[]).filter(v=>v!=null);
      const cl1y = (q1y.low||[]).filter(v=>v!=null&&v>0);
      if (ch1y.length) hi52 = '$'+fmt(Math.max(...ch1y));
      if (cl1y.length) lo52 = '$'+fmt(Math.min(...cl1y));
    } catch(_) {}

    const rows = [
      ['SYMBOL',    meta.symbol||sym],
      ['EXCHANGE',  meta.exchangeName||'—'],
      ['52W HIGH',  hi52],
      ['52W LOW',   lo52],
      ['VOLUME',    meta.regularMarketVolume ? fmtB(meta.regularMarketVolume):'—'],
      ['PREV CLOSE',`$${fmt(prev)}`],
      ['CURRENCY',  meta.currency||'—'],
      ['TYPE',      meta.instrumentType||'—'],
    ];

    html('stats-grid', rows.map(([l,v]) => `
      <div class="stat-card">
        <div class="stat-lbl">${l}</div>
        <div class="stat-val">${v||'—'}</div>
      </div>`).join(''));

    hide('ov-load'); show('ov-body');
    $('header-status').textContent = `${sym} · ${meta.exchangeName||''} · $${fmt(price)}`;
  } catch(e) {
    hide('ov-load'); show('ov-err');
    $('ov-et').textContent = `⚠ ${e.message}`;
    $('header-status').textContent = 'ERROR';
  }
}

// ═══════════════════════════════════════════════════════════
// CHART — TradingView Advanced Chart Widget
//
// WHY TradingView instead of Yahoo Finance for the chart:
//   • Loads data from TradingView's own servers — no CORS, no rate limits
//   • Candlestick, volume, indicators, drawing tools all built in
//   • Fast — data streams from TradingView CDN
//   • The tv.js script loads once and is ~600KB cached by browser
// ═══════════════════════════════════════════════════════════
function loadTVScript() {
  return new Promise((resolve, reject) => {
    if (window.TradingView) { resolve(); return; }
    const s   = document.createElement('script');
    s.src     = 'https://s3.tradingview.com/tv.js';
    s.onload  = resolve;
    s.onerror = () => reject(new Error('TradingView script blocked. Check your internet connection.'));
    document.head.appendChild(s);
  });
}

function createTVWidget(sym, tvInterval) {
  // Clear previous widget
  const outer = $('tv-outer');
  outer.innerHTML = '<div id="tv-chart" style="height:100%;width:100%"></div>';

  new TradingView.widget({
    container_id:       'tv-chart',
    autosize:           true,
    symbol:             sym,           // TradingView auto-resolves exchange
    interval:           tvInterval,    // 'D' | 'W' | 'M'
    timezone:           'Etc/UTC',
    theme:              'dark',
    style:              '1',           // 1 = candlestick
    locale:             'en',
    toolbar_bg:         '#0d0d1a',
    enable_publishing:  false,
    hide_side_toolbar:  false,         // keep drawing tools panel
    hide_top_toolbar:   false,         // keep indicator / interval bar
    allow_symbol_change:false,
    save_image:         false,
    withdateranges:     true,
    studies:            ['MASimple@tv-built-ins'],  // adds MA by default
    overrides: {
      'paneProperties.background':           '#0d0d1a',
      'paneProperties.backgroundType':       'solid',
      'paneProperties.vertGridProperties.color': '#16162a',
      'paneProperties.horzGridProperties.color': '#16162a',
      'scalesProperties.textColor':          '#c8d0e0',
    },
  });
}

async function loadChart(sym, pidx) {
  hide('ch-body'); hide('ch-err');
  show('ch-load');
  try {
    await loadTVScript();           // no-op if already loaded
    const iv = PERIODS[pidx].tv;   // 'D', 'W', or 'M'
    createTVWidget(sym, iv);
    hide('ch-load'); show('ch-body');
    S.chartLoaded = true;
  } catch(e) {
    hide('ch-load'); show('ch-err');
    $('ch-et').textContent = `⚠ ${e.message}`;
  }
}

// ═══════════════════════════════════════════════════════════
// NEWS
// ═══════════════════════════════════════════════════════════
async function loadNews(sym) {
  hide('nw-idle'); hide('nw-err'); html('nw-body','');
  show('nw-load');
  try {
    const rssUrl = encodeURIComponent(
      `https://feeds.finance.yahoo.com/rss/2.0/headline?s=${sym}&region=US&lang=en-US`);
    const r = await fetchTimeout(
      `https://api.rss2json.com/v1/api.json?rss_url=${rssUrl}&count=8`, 8000);
    if (!r.ok) throw new Error('News service unavailable');
    const data = await r.json();
    if (data.status !== 'ok') throw new Error(data.message||'Feed error');
    const items = data.items||[];
    if (!items.length) throw new Error('No articles found for '+sym);
    hide('nw-load');
    html('nw-body', items.map(item => {
      const d    = new Date(item.pubDate)
        .toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const desc = item.description
        ? item.description.replace(/<[^>]*>/g,'').trim().slice(0,240)+'…' : '';
      return `<div class="news-card">
        <div class="news-meta">${item.author||'Yahoo Finance'} · ${d}</div>
        <div class="news-title">${item.title}</div>
        ${desc ? `<div class="news-desc">${desc}</div>` : ''}
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-link">READ →</a>
      </div>`;
    }).join(''));
    S.newsLoaded = true;
  } catch(e) {
    hide('nw-load'); show('nw-err');
    $('nw-et').textContent = `⚠ ${e.message}`;
  }
}

// ═══════════════════════════════════════════════════════════
// FILINGS
// ═══════════════════════════════════════════════════════════
async function loadFilings(sym) {
  hide('fi-idle'); hide('fi-err'); html('fi-body','');
  show('fi-load');
  try {
    const tr = await fetchTimeout('https://www.sec.gov/files/company_tickers.json', 8000);
    if (!tr.ok) throw new Error('SEC EDGAR unreachable');
    const tickers = await tr.json();
    let cikRaw=null, cName=null;
    for (const v of Object.values(tickers)) {
      if (v.ticker.toLowerCase()===sym.toLowerCase()){cikRaw=v.cik_str;cName=v.title;break;}
    }
    if (!cikRaw) throw new Error(`"${sym}" not found in SEC EDGAR`);
    const cikPad = String(cikRaw).padStart(10,'0');
    const sr = await fetchTimeout(`https://data.sec.gov/submissions/CIK${cikPad}.json`, 8000);
    if (!sr.ok) throw new Error('Submissions fetch failed');
    const sub = await sr.json();
    const {form,filingDate,primaryDocument,accessionNumber} = sub.filings.recent;
    const list=[];
    for (let i=0;i<form.length&&list.length<20;i++){
      if (FORMS.includes(form[i])){
        const acc=accessionNumber[i].replace(/-/g,'');
        list.push({form:form[i],date:filingDate[i],
          url:`https://www.sec.gov/Archives/edgar/data/${cikRaw}/${acc}/${primaryDocument[i]}`});
      }
    }
    hide('fi-load');
    html('fi-body',`<div class="card" style="padding:16px">
      <div class="fil-head">${cName} · CIK ${cikRaw} · ${list.length} FILINGS</div>
      ${list.map(f=>{const fc=FORM_C[f.form]||'#505068';return`
        <div class="fil-row">
          <span class="fbadge" style="background:${fc}18;color:${fc};border:1px solid ${fc}40">${f.form}</span>
          <span class="fdate">${f.date}</span>
          <span class="fdesc">${FORM_D[f.form]||f.form}</span>
          <a href="${f.url}" target="_blank" rel="noopener noreferrer" class="flink">VIEW →</a>
        </div>`;}).join('')}
    </div>`);
    S.filingsLoaded = true;
  } catch(e) {
    hide('fi-load'); show('fi-err');
    $('fi-et').textContent = `⚠ ${e.message}`;
  }
}

// ═══════════════════════════════════════════════════════════
// FETCH HANDLER
// ═══════════════════════════════════════════════════════════
function doFetch() {
  const sym = $('ticker-input').value.trim().toUpperCase();
  if (!sym) return;
  S.ticker = sym;
  S.chartLoaded = S.newsLoaded = S.filingsLoaded = false;
  loadPrice(sym);
  if (S.tab==='chart')   loadChart(sym, S.pidx);
  if (S.tab==='news')    loadNews(sym);
  if (S.tab==='filings') loadFilings(sym);
}

// ═══════════════════════════════════════════════════════════
// PERIOD BUTTONS
// ═══════════════════════════════════════════════════════════
PERIODS.forEach((p, i) => {
  const b = document.createElement('button');
  b.className   = 'tv-btn' + (i===0?' active':'');
  b.textContent = p.label;
  b.title       = p.tip;
  b.addEventListener('click', () => {
    if (S.pidx===i && S.chartLoaded) return;
    S.pidx = i;
    $('period-btns').querySelectorAll('.tv-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    S.chartLoaded = false;
    loadChart(S.ticker, i);
  });
  $('period-btns').appendChild(b);
});

// ═══════════════════════════════════════════════════════════
// TABS
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    const tab = btn.dataset.tab;
    S.tab = tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    $('tab-'+tab).classList.add('active');
    if (tab==='chart'   && !S.chartLoaded)   loadChart(S.ticker, S.pidx);
    if (tab==='news'    && !S.newsLoaded)    loadNews(S.ticker);
    if (tab==='filings' && !S.filingsLoaded) loadFilings(S.ticker);
  });
});

// ═══════════════════════════════════════════════════════════
// RETRY + INPUT
// ═══════════════════════════════════════════════════════════
$('ov-retry').addEventListener('click', ()=>loadPrice(S.ticker));
$('ch-retry').addEventListener('click', ()=>{ S.chartLoaded=false; loadChart(S.ticker,S.pidx); });
$('nw-retry').addEventListener('click', ()=>loadNews(S.ticker));
$('fi-retry').addEventListener('click', ()=>loadFilings(S.ticker));
$('fetch-btn').addEventListener('click', doFetch);
$('ticker-input').addEventListener('keydown', e=>{ if(e.key==='Enter') doFetch(); });

// ═══════════════════════════════════════════════════════════
// BOOT
// ═══════════════════════════════════════════════════════════
loadPrice('AAPL');
</script>
</body>
</html>
