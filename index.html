<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock Terminal</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --green:#00e676; --red:#ff4466; --blue:#4488ff;
  --amber:#ff9500; --purple:#aa44ff; --text:#c8d0e0;
  --muted:#505068; --border:#1c1c30; --panel:#0d0d1a;
  --bg:#070710; --hdr:#08080f; --inp:#101020;
}
body { font-family:'Courier New',Courier,monospace; background:var(--bg); color:var(--text); min-height:100vh; }
a { text-decoration:none; }
button { cursor:pointer; font-family:inherit; }
input  { font-family:inherit; }

/* ── Header ── */
#header {
  border-bottom:1px solid var(--border); padding:11px 18px;
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--hdr);
}
.logo { color:var(--green); font-size:13px; font-weight:700; letter-spacing:4px; margin-right:6px; white-space:nowrap; }
#ticker-input {
  background:var(--inp); border:1px solid var(--border); color:var(--text);
  font-size:13px; padding:5px 10px; border-radius:3px; outline:none;
  width:90px; letter-spacing:2px; text-transform:uppercase;
}
#search-btn {
  background:var(--green); color:#060610; border:none;
  font-size:10px; font-weight:700; padding:6px 14px; border-radius:3px; letter-spacing:2px;
}
#hdr-status { font-size:11px; color:var(--muted); }

/* ── Tabs ── */
#tabs { display:flex; border-bottom:1px solid var(--border); background:var(--hdr); padding:0 14px; }
.tab-btn {
  padding:10px 14px; font-size:10px; letter-spacing:2px; border:none; background:none;
  color:var(--muted); border-bottom:2px solid transparent;
}
.tab-btn.active { color:var(--green); border-bottom-color:var(--green); }

/* ── Content ── */
#content { padding:16px 18px; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }

/* ── Reusable ── */
.card { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:14px 18px; margin-bottom:12px; }
.lbl  { font-size:9px; color:var(--muted); letter-spacing:3px; margin-bottom:6px; }
.loading-msg { color:var(--muted); font-size:11px; padding:30px; text-align:center; letter-spacing:2px; }
.error-msg {
  color:var(--red); font-size:11px; padding:12px;
  background:#1a0008; border:1px solid #330011; border-radius:4px; margin-bottom:12px;
}
.retry-btn { margin-left:10px; color:var(--green); background:none; border:none; font-size:10px; cursor:pointer; font-family:inherit; }

/* ── Overview stats ── */
.stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(130px,1fr)); gap:8px; margin-bottom:14px; }
.stat-card { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:10px 12px; }
.stat-label { font-size:9px; color:var(--muted); letter-spacing:2px; margin-bottom:4px; }
.stat-val   { font-size:14px; color:var(--text); }

/* ── Chart ── */
#chart-controls { display:flex; align-items:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
.range-btn { padding:3px 10px; font-size:10px; letter-spacing:1px; border-radius:3px; border:1px solid var(--border); background:var(--inp); color:var(--muted); }
.range-btn.active { border-color:var(--green); background:#003316; color:var(--green); }
.divider  { width:1px; height:18px; background:var(--border); margin:0 4px; }
.ma-btn   { display:inline-flex; align-items:center; gap:5px; padding:3px 10px; border-radius:3px; font-size:10px; letter-spacing:1px; }
.chart-wrap { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:16px; }
.ma-values  { display:flex; gap:16px; padding:10px 0 0; border-top:1px solid var(--border); font-size:11px; flex-wrap:wrap; margin-top:12px; }
#chart-canvas { display:block; width:100% !important; height:340px !important; }

/* ── News ── */
.news-card { background:var(--panel); border:1px solid var(--border); border-radius:4px; padding:14px; margin-bottom:10px; }
.news-meta { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.news-src  { font-size:10px; color:var(--muted); }
.news-ttl  { font-size:13px; color:var(--text); line-height:1.5; }
.news-ttl a { color:var(--text); }
.news-ttl a:hover { color:var(--green); }

/* ── Filings ── */
.filing-row { display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #111120; }
.form-badge { font-size:9px; padding:2px 8px; border-radius:2px; letter-spacing:1px; font-weight:700; min-width:52px; text-align:center; white-space:nowrap; }
.filing-date { font-size:10px; color:var(--muted); min-width:84px; }
.filing-type { font-size:11px; color:var(--text); flex:1; }
.view-link { font-size:9px; color:var(--green); letter-spacing:1px; padding:2px 8px; border:1px solid #003316; border-radius:2px; white-space:nowrap; }
</style>
</head>
<body>

<div id="app">

  <div id="header">
    <span class="logo">◈ TERMINAL</span>
    <input id="ticker-input" type="text" value="AAPL" maxlength="10" placeholder="TICKER" autocomplete="off">
    <button id="search-btn">FETCH →</button>
    <span id="hdr-status"></span>
  </div>

  <div id="tabs">
    <button class="tab-btn active" data-tab="overview">OVERVIEW</button>
    <button class="tab-btn" data-tab="chart">CHART</button>
    <button class="tab-btn" data-tab="news">NEWS</button>
    <button class="tab-btn" data-tab="filings">FILINGS</button>
  </div>

  <div id="content">

    <div id="tab-overview" class="tab-panel active">
      <div class="loading-msg">⬡ INITIALIZING...</div>
    </div>

    <div id="tab-chart" class="tab-panel">
      <div id="chart-controls">
        <div id="range-btns" style="display:flex;gap:4px;">
          <button class="range-btn" data-range="1m">1M</button>
          <button class="range-btn" data-range="3m">3M</button>
          <button class="range-btn" data-range="6m">6M</button>
          <button class="range-btn active" data-range="1y">1Y</button>
          <button class="range-btn" data-range="2y">2Y</button>
          <button class="range-btn" data-range="5y">5Y</button>
        </div>
        <div class="divider"></div>
        <button class="ma-btn" id="ma20-btn" data-ma="ma20" style="border:1px solid var(--amber);background:rgba(255,149,0,0.09);color:var(--amber);">● MA20</button>
        <button class="ma-btn" id="ma50-btn" data-ma="ma50" style="border:1px solid var(--blue);background:rgba(68,136,255,0.09);color:var(--blue);">● MA50</button>
        <button class="ma-btn" id="ma200-btn" data-ma="ma200" style="border:1px solid var(--purple);background:rgba(170,68,255,0.09);color:var(--purple);">● MA200</button>
      </div>
      <div id="chart-content">
        <div class="loading-msg">⬡ LOAD A TICKER TO SEE CHART</div>
      </div>
    </div>

    <div id="tab-news" class="tab-panel">
      <div class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    </div>

    <div id="tab-filings" class="tab-panel">
      <div class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    </div>

  </div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
//  CONSTANTS
// ═══════════════════════════════════════════════════════════
const YF_RANGE    = { '1m':'1mo','3m':'3mo','6m':'6mo','1y':'1y','2y':'2y','5y':'5y' };
const YF_INTERVAL = { '1m':'1d','3m':'1d','6m':'1d','1y':'1d','2y':'1wk','5y':'1wk' };

const FORMS = ['10-K','10-Q','8-K','DEF 14A','4','S-1','S-3'];
const FORM_NAMES = {
  '10-K':'Annual Report','10-Q':'Quarterly Report','8-K':'Current Report',
  'DEF 14A':'Proxy Statement','4':'Insider Trade','S-1':'IPO Registration','S-3':'Shelf Registration',
};
const FORM_COLORS = {
  '10-K':'#4488ff','10-Q':'#00bcd4','8-K':'#ff9500',
  'DEF 14A':'#aa44ff','4':'#ff4466','S-1':'#00e676','S-3':'#44cc88',
};

// ═══════════════════════════════════════════════════════════
//  STATE
// ═══════════════════════════════════════════════════════════
const state = {
  ticker   : 'AAPL',
  range    : '1y',
  showMA   : { ma20:true, ma50:true, ma200:true },
  chartRef : null,
  loaded   : { news:false, filings:false },
};

// ═══════════════════════════════════════════════════════════
//  UTILITIES
// ═══════════════════════════════════════════════════════════
function calcMA(arr, period) {
  return arr.map((_, i) => {
    if (i < period - 1) return null;
    const s = arr.slice(i - period + 1, i + 1).reduce((a,b) => a+b, 0);
    return parseFloat((s / period).toFixed(4));
  });
}

function fmt(v, d=2) {
  if (v == null || isNaN(Number(v))) return '—';
  return Number(v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}

function fmtLarge(n) {
  if (!n) return '—';
  if (n >= 1e12) return (n/1e12).toFixed(2)+'T';
  if (n >= 1e9)  return (n/1e9).toFixed(2)+'B';
  if (n >= 1e6)  return (n/1e6).toFixed(2)+'M';
  if (n >= 1e3)  return (n/1e3).toFixed(0)+'K';
  return String(n);
}

function fmtTs(ts) {
  return new Date(ts*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function fmtNewsAge(ts) {
  const diff = (Date.now() - ts*1000)/1000;
  if (diff < 3600)  return Math.floor(diff/60)+'m ago';
  if (diff < 86400) return Math.floor(diff/3600)+'h ago';
  return new Date(ts*1000).toLocaleDateString('en-US',{month:'short',day:'numeric'});
}

function lastNonNull(arr) {
  for (let i = arr.length-1; i >= 0; i--) if (arr[i] != null) return arr[i];
  return null;
}

// ═══════════════════════════════════════════════════════════
//  FETCH — tries two CORS proxies then direct
// ═══════════════════════════════════════════════════════════
const PROXIES = [
  u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`,
  u => `https://corsproxy.io/?${encodeURIComponent(u)}`,
];

async function yfFetch(url) {
  let lastErr;
  for (const proxy of PROXIES) {
    try {
      const c = new AbortController();
      const tid = setTimeout(() => c.abort(), 12000);
      const res = await fetch(proxy(url), { signal:c.signal });
      clearTimeout(tid);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    } catch(e) { lastErr = e; }
  }
  throw new Error(lastErr?.message || 'All proxies failed');
}

async function directFetch(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════════════════════
//  OVERVIEW LOADER
// ═══════════════════════════════════════════════════════════
async function loadOverview(ticker) {
  const el = document.getElementById('tab-overview');
  el.innerHTML = '<div class="loading-msg">⬡ FETCHING PRICE DATA...</div>';
  document.getElementById('hdr-status').textContent = '';

  try {
    const url = `https://query1.finance.yahoo.com/v10/finance/quoteSummary/${ticker}` +
                `?modules=price,summaryDetail,defaultKeyStatistics`;
    const data  = await yfFetch(url);
    const res   = data.quoteSummary?.result?.[0];
    if (!res) throw new Error('No data — check the ticker symbol');

    const p  = res.price            || {};
    const sd = res.summaryDetail    || {};
    const ks = res.defaultKeyStatistics || {};

    const price     = p.regularMarketPrice?.raw;
    const change    = p.regularMarketChange?.raw;
    const changePct = p.regularMarketChangePercent?.raw;
    const name      = p.longName || p.shortName || ticker;
    const exchange  = p.exchangeName || '';

    document.getElementById('hdr-status').textContent = `${ticker} · ${name} · ${exchange}`;

    const up    = change >= 0;
    const pCol  = up ? 'var(--green)' : 'var(--red)';
    const sign  = up ? '+' : '';

    function sc(label, val) {
      return `<div class="stat-card"><div class="stat-label">${label}</div><div class="stat-val">${val||'—'}</div></div>`;
    }

    el.innerHTML = `
      <div class="card">
        <div class="lbl">LAST PRICE · ${exchange}</div>
        <div style="display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;">
          <span style="font-size:36px;color:var(--text);font-weight:300;">$${fmt(price)}</span>
          <span style="font-size:16px;color:${pCol};">${sign}${fmt(change)} (${sign}${fmt((changePct||0)*100)}%)</span>
        </div>
      </div>
      <div class="stat-grid">
        ${sc('MARKET CAP',  fmtLarge(p.marketCap?.raw))}
        ${sc('P/E RATIO',   fmt(sd.trailingPE?.raw))}
        ${sc('52W HIGH',   '$'+fmt(sd.fiftyTwoWeekHigh?.raw))}
        ${sc('52W LOW',    '$'+fmt(sd.fiftyTwoWeekLow?.raw))}
        ${sc('VOLUME',      fmtLarge(p.regularMarketVolume?.raw))}
        ${sc('AVG VOLUME',  fmtLarge(sd.averageVolume?.raw))}
        ${sc('BETA',        fmt(sd.beta?.raw))}
        ${sc('EPS (TTM)',   fmt(ks.trailingEps?.raw))}
        ${sc('DIV YIELD',   sd.dividendYield?.raw ? (sd.dividendYield.raw*100).toFixed(2)+'%' : '—')}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="error-msg">⚠ ${e.message}
      <button class="retry-btn" onclick="loadOverview('${ticker}')">RETRY</button></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  CHART LOADER
// ═══════════════════════════════════════════════════════════
async function loadChart(ticker, range) {
  const el = document.getElementById('chart-content');
  el.innerHTML = '<div class="loading-msg">⬡ LOADING CHART DATA...</div>';
  if (state.chartRef) { state.chartRef.destroy(); state.chartRef = null; }

  try {
    const url = `https://query1.finance.yahoo.com/v8/finance/chart/${ticker}` +
                `?interval=${YF_INTERVAL[range]}&range=${YF_RANGE[range]}&includePrePost=false`;
    const data   = await yfFetch(url);
    const result = data.chart?.result?.[0];
    if (!result) throw new Error('No chart data returned');

    const ts     = result.timestamp;
    const closes = result.indicators.quote[0].close;
    const valid  = ts.map((t,i)=>({t,c:closes[i]})).filter(d=>d.c!=null);

    const dates  = valid.map(d => fmtTs(d.t));
    const prices = valid.map(d => parseFloat(d.c.toFixed(4)));

    const ma20  = calcMA(prices, 20);
    const ma50  = calcMA(prices, 50);
    const ma200 = calcMA(prices, 200);

    el.innerHTML = `
      <div class="chart-wrap">
        <canvas id="chart-canvas"></canvas>
        <div class="ma-values">
          <span style="color:var(--amber)">MA20: <strong>$${fmt(lastNonNull(ma20))}</strong></span>
          <span style="color:var(--blue)">MA50: <strong>$${fmt(lastNonNull(ma50))}</strong></span>
          <span style="color:var(--purple)">MA200: <strong>$${fmt(lastNonNull(ma200))}</strong></span>
          <span style="color:var(--muted)">Current: <strong style="color:var(--green)">$${fmt(prices[prices.length-1])}</strong></span>
        </div>
      </div>`;

    const ctx = document.getElementById('chart-canvas').getContext('2d');
    state.chartRef = new Chart(ctx, {
      type: 'line',
      data: {
        labels: dates,
        datasets: [
          { label:'Price', data:prices, borderColor:'#00e676', backgroundColor:'rgba(0,230,118,0.07)',
            borderWidth:1.5, fill:true, pointRadius:0, tension:0.1, order:4 },
          { label:'MA20',  data:ma20,  borderColor:'#ff9500', fill:false,
            borderWidth:1.5, pointRadius:0, tension:0.1, spanGaps:true, hidden:!state.showMA.ma20, order:3 },
          { label:'MA50',  data:ma50,  borderColor:'#4488ff', fill:false,
            borderWidth:1.5, pointRadius:0, tension:0.1, spanGaps:true, hidden:!state.showMA.ma50, order:2 },
          { label:'MA200', data:ma200, borderColor:'#aa44ff', fill:false,
            borderWidth:1.5, pointRadius:0, tension:0.1, spanGaps:true, hidden:!state.showMA.ma200, order:1 },
        ],
      },
      options: {
        responsive:true, maintainAspectRatio:false, animation:{ duration:400 },
        interaction:{ mode:'index', intersect:false },
        plugins: {
          legend: { display:false },
          tooltip: {
            backgroundColor:'#0d0d1a', borderColor:'#1c1c30', borderWidth:1,
            titleColor:'#505068', bodyColor:'#c8d0e0',
            titleFont:{ family:'Courier New',size:11 }, bodyFont:{ family:'Courier New',size:11 },
            callbacks: { label: ctx => ctx.raw==null ? null : `${ctx.dataset.label}: $${fmt(ctx.raw)}` },
          },
        },
        scales: {
          x: {
            grid:{ color:'#16162a' },
            ticks:{ color:'#505068', font:{ family:'Courier New',size:10 }, maxTicksLimit:8, maxRotation:0 },
          },
          y: {
            grid:{ color:'#16162a' },
            ticks:{ color:'#505068', font:{ family:'Courier New',size:10 }, callback:v=>`$${v}` },
          },
        },
      },
    });
  } catch(e) {
    el.innerHTML = `<div class="error-msg">⚠ ${e.message}
      <button class="retry-btn" onclick="loadChart('${ticker}','${range}')">RETRY</button></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  NEWS LOADER  (Yahoo Finance search endpoint)
// ═══════════════════════════════════════════════════════════
async function loadNews(ticker) {
  const el = document.getElementById('tab-news');
  el.innerHTML = '<div class="loading-msg">⬡ SEARCHING NEWS...</div>';
  try {
    const url  = `https://query1.finance.yahoo.com/v1/finance/search?q=${ticker}&newsCount=10&quotesCount=0&enableFuzzyQuery=false`;
    const data = await yfFetch(url);
    const items = data.news || [];
    if (!items.length) throw new Error('No news found for this ticker');
    el.innerHTML = items.map(item => `
      <div class="news-card">
        <div class="news-meta">
          <span class="news-src">${item.publisher||''} · ${fmtNewsAge(item.providerPublishTime)}</span>
        </div>
        <div class="news-ttl">
          <a href="${item.link}" target="_blank" rel="noopener noreferrer">${item.title}</a>
        </div>
      </div>`).join('');
  } catch(e) {
    el.innerHTML = `<div class="error-msg">⚠ ${e.message}
      <button class="retry-btn" onclick="loadNews('${ticker}')">RETRY</button></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  FILINGS LOADER  (SEC EDGAR — no proxy needed, CORS open)
// ═══════════════════════════════════════════════════════════
async function loadFilings(ticker) {
  const el = document.getElementById('tab-filings');
  el.innerHTML = '<div class="loading-msg">⬡ QUERYING SEC EDGAR...</div>';
  try {
    const tickers = await directFetch('https://www.sec.gov/files/company_tickers.json');
    let cikRaw = null, cName = null;
    for (const v of Object.values(tickers)) {
      if (v.ticker.toLowerCase() === ticker.toLowerCase()) { cikRaw=v.cik_str; cName=v.title; break; }
    }
    if (!cikRaw) throw new Error(`${ticker} not found in SEC EDGAR`);

    const cikPad = String(cikRaw).padStart(10,'0');
    const sub    = await directFetch(`https://data.sec.gov/submissions/CIK${cikPad}.json`);
    const { form, filingDate, primaryDocument, accessionNumber } = sub.filings.recent;

    const list = [];
    for (let i = 0; i < form.length && list.length < 20; i++) {
      if (FORMS.includes(form[i])) {
        const acc = accessionNumber[i].replace(/-/g,'');
        list.push({
          form:form[i], date:filingDate[i],
          url:`https://www.sec.gov/Archives/edgar/data/${cikRaw}/${acc}/${primaryDocument[i]}`,
        });
      }
    }

    el.innerHTML = `
      <div class="card">
        <div class="lbl">${cName} · CIK ${cikRaw} · ${list.length} FILINGS FOUND</div>
        ${list.map(f=>{
          const fc = FORM_COLORS[f.form]||'#505068';
          return `<div class="filing-row">
            <span class="form-badge" style="background:${fc}18;color:${fc};border:1px solid ${fc}40;">${f.form}</span>
            <span class="filing-date">${f.date}</span>
            <span class="filing-type">${FORM_NAMES[f.form]||f.form}</span>
            <a class="view-link" href="${f.url}" target="_blank" rel="noopener noreferrer">VIEW →</a>
          </div>`;
        }).join('')}
      </div>`;
  } catch(e) {
    el.innerHTML = `<div class="error-msg">⚠ ${e.message}
      <button class="retry-btn" onclick="loadFilings('${ticker}')">RETRY</button></div>`;
  }
}

// ═══════════════════════════════════════════════════════════
//  TAB SWITCHING
// ═══════════════════════════════════════════════════════════
function switchTab(tab) {
  document.querySelectorAll('.tab-btn').forEach(b   => b.classList.toggle('active', b.dataset.tab===tab));
  document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id===`tab-${tab}`));
  if (tab==='news'    && !state.loaded.news)    { state.loaded.news=true;    loadNews(state.ticker); }
  if (tab==='filings' && !state.loaded.filings) { state.loaded.filings=true; loadFilings(state.ticker); }
  if (tab==='chart'   && !state.chartRef)       { loadChart(state.ticker, state.range); }
}

// ═══════════════════════════════════════════════════════════
//  SEARCH
// ═══════════════════════════════════════════════════════════
function handleSearch() {
  const sym = document.getElementById('ticker-input').value.trim().toUpperCase();
  if (!sym) return;
  state.ticker  = sym;
  state.loaded  = { news:false, filings:false };
  if (state.chartRef) { state.chartRef.destroy(); state.chartRef = null; }
  document.getElementById('tab-news').innerHTML    = '<div class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>';
  document.getElementById('tab-filings').innerHTML = '<div class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>';
  loadOverview(sym);
  loadChart(sym, state.range);
  const active = document.querySelector('.tab-btn.active')?.dataset.tab;
  if (active==='news')    { state.loaded.news=true;    loadNews(sym); }
  if (active==='filings') { state.loaded.filings=true; loadFilings(sym); }
}

// ═══════════════════════════════════════════════════════════
//  RANGE BUTTONS
// ═══════════════════════════════════════════════════════════
document.getElementById('range-btns').addEventListener('click', e => {
  const btn = e.target.closest('.range-btn');
  if (!btn) return;
  state.range = btn.dataset.range;
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range===state.range));
  if (state.chartRef) { state.chartRef.destroy(); state.chartRef=null; }
  loadChart(state.ticker, state.range);
});

// ═══════════════════════════════════════════════════════════
//  MA TOGGLE BUTTONS
// ═══════════════════════════════════════════════════════════
const MA_COLORS = { ma20:'#ff9500', ma50:'#4488ff', ma200:'#aa44ff' };

function syncMABtn(key) {
  const btn = document.getElementById(`${key}-btn`);
  const col = MA_COLORS[key];
  const on  = state.showMA[key];
  btn.style.border     = on ? `1px solid ${col}` : '1px solid var(--border)';
  btn.style.background = on ? `${col}18`         : 'var(--inp)';
  btn.style.color      = on ? col                : 'var(--muted)';
}

['ma20','ma50','ma200'].forEach(key => {
  document.getElementById(`${key}-btn`).addEventListener('click', () => {
    state.showMA[key] = !state.showMA[key];
    syncMABtn(key);
    if (state.chartRef) {
      const labelMap = { ma20:'MA20', ma50:'MA50', ma200:'MA200' };
      const ds = state.chartRef.data.datasets.find(d => d.label===labelMap[key]);
      if (ds) { ds.hidden = !state.showMA[key]; state.chartRef.update(); }
    }
  });
});

// ═══════════════════════════════════════════════════════════
//  TAB CLICK HANDLER
// ═══════════════════════════════════════════════════════════
document.getElementById('tabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab-btn');
  if (btn) switchTab(btn.dataset.tab);
});

// ═══════════════════════════════════════════════════════════
//  SEARCH BUTTON & ENTER KEY
// ═══════════════════════════════════════════════════════════
document.getElementById('search-btn').addEventListener('click', handleSearch);
document.getElementById('ticker-input').addEventListener('keydown', e => { if (e.key==='Enter') handleSearch(); });

// ═══════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════
loadOverview('AAPL');
loadChart('AAPL', '1y');
</script>
