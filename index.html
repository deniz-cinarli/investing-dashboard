<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Terminal</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
a { text-decoration: none; }
body { background: #070710; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
<script type="text/babel">
const { useState, useEffect, useCallback } = React;
const { ComposedChart, Area, Line, XAxis, YAxis, CartesianGrid, Tooltip, ResponsiveContainer } = Recharts;

// ── Utilities ─────────────────────────────────────────────────────────────────
function calcMA(prices, period) {
  return prices.map((_, i) => {
    if (i < period - 1) return null;
    const sum = prices.slice(i - period + 1, i + 1).reduce((a, b) => a + b, 0);
    return parseFloat((sum / period).toFixed(2));
  });
}

function fmtTs(ts) {
  return new Date(ts * 1000).toLocaleDateString("en-US", { month: "short", day: "numeric" });
}

function n(v, d = 2) {
  if (v == null || isNaN(Number(v))) return "—";
  return Number(v).toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
}

async function askClaude(prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-20250514",
      max_tokens: 1000,
      tools: [{ type: "web_search_20250305", name: "web_search" }],
      messages: [{ role: "user", content: prompt }],
    }),
  });
  if (!res.ok) throw new Error(`API error ${res.status}`);
  const data = await res.json();
  return data.content.filter(b => b.type === "text").map(b => b.text).join("\n");
}

function parseJSON(text, arr = false) {
  const m = text.match(arr ? /\[[\s\S]*\]/ : /\{[\s\S]*\}/);
  if (!m) throw new Error("No JSON in response");
  return JSON.parse(m[0]);
}

// ── Constants ─────────────────────────────────────────────────────────────────
const RANGES = ["1m", "3m", "6m", "1y", "2y", "5y"];
const YF_R = { "1m": "1mo", "3m": "3mo", "6m": "6mo", "1y": "1y", "2y": "2y", "5y": "5y" };
const YF_I = { "1m": "1d", "3m": "1d", "6m": "1d", "1y": "1d", "2y": "1wk", "5y": "1wk" };
const FORMS = ["10-K", "10-Q", "8-K", "DEF 14A", "4", "S-1", "S-3"];
const FORM_D = {
  "10-K": "Annual Report", "10-Q": "Quarterly Report",
  "8-K": "Current Report", "DEF 14A": "Proxy Statement",
  "4": "Insider Trade", "S-1": "IPO Registration", "S-3": "Shelf Registration",
};
const FORM_C = {
  "10-K": "#4488ff", "10-Q": "#00bcd4", "8-K": "#ff9500",
  "DEF 14A": "#aa44ff", "4": "#ff4466", "S-1": "#00e676", "S-3": "#44cc88",
};

const C = {
  green: "#00e676", red: "#ff4466", blue: "#4488ff",
  amber: "#ff9500", purple: "#aa44ff", text: "#c8d0e0",
  muted: "#505068", border: "#1c1c30", panel: "#0d0d1a", inp: "#101020",
};

// ── Main Component ─────────────────────────────────────────────────────────────
function StockTerminal() {
  const [input, setInput] = useState("AAPL");
  const [ticker, setTicker] = useState("AAPL");
  const [tab, setTab] = useState("overview");
  const [range, setRange] = useState("1y");
  const [showMA, setShowMA] = useState({ ma20: true, ma50: true, ma200: true });

  const [price, setPrice] = useState(null);
  const [chart, setChart] = useState(null);
  const [news, setNews] = useState(null);
  const [filings, setFilings] = useState(null);

  const [pSt, setPSt] = useState("idle");
  const [cSt, setCSt] = useState("idle");
  const [nSt, setNSt] = useState("idle");
  const [fSt, setFSt] = useState("idle");

  const [pErr, setPErr] = useState("");
  const [cErr, setCErr] = useState("");
  const [nErr, setNErr] = useState("");
  const [fErr, setFErr] = useState("");

  // ── Loaders ──────────────────────────────────────────────────────────────────
  const loadPrice = useCallback(async (sym) => {
    setPSt("loading"); setPErr("");
    try {
      const raw = await askClaude(
        `Search for current stock data for ticker ${sym}. Return ONLY raw JSON, no markdown backticks or explanation: ` +
        `{"price":number,"change":number,"changePercent":number,"marketCap":"string","peRatio":"string",` +
        `"high52w":number,"low52w":number,"volume":"string","avgVolume":"string","beta":"string",` +
        `"eps":"string","dividendYield":"string","name":"string","exchange":"string","sector":"string"}`
      );
      setPrice(parseJSON(raw));
      setPSt("done");
    } catch (e) { setPErr(e.message); setPSt("error"); }
  }, []);

  const loadChart = useCallback(async (sym, r) => {
    setCSt("loading"); setCErr(""); setChart(null);
    const tryFetch = async (host) => {
      const url = `${host}/v8/finance/chart/${sym}?interval=${YF_I[r]}&range=${YF_R[r]}&includePrePost=false`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    };
    try {
      let json;
      try { json = await tryFetch("https://query1.finance.yahoo.com"); }
      catch { json = await tryFetch("https://query2.finance.yahoo.com"); }
      const result = json.chart?.result?.[0];
      if (!result) throw new Error("No data returned");
      const ts = result.timestamp;
      const closes = result.indicators.quote[0].close;
      const valid = ts.map((t, i) => ({ t, c: closes[i] })).filter(d => d.c != null);
      const prices = valid.map(d => d.c);
      const ma20 = calcMA(prices, 20);
      const ma50 = calcMA(prices, 50);
      const ma200 = calcMA(prices, 200);
      setChart(valid.map((d, i) => ({
        date: fmtTs(d.t),
        price: parseFloat(d.c.toFixed(2)),
        ma20: ma20[i], ma50: ma50[i], ma200: ma200[i],
      })));
      setCSt("done");
    } catch (e) { setCErr(e.message); setCSt("error"); }
  }, []);

  const loadNews = useCallback(async (sym) => {
    setNSt("loading"); setNErr("");
    try {
      const raw = await askClaude(
        `Search for the 6 most recent important news articles about ${sym} stock from the last 2 weeks. ` +
        `Include earnings, analysts, products, regulatory news. ` +
        `Return ONLY a raw JSON array, no markdown: ` +
        `[{"title":"string","source":"string","date":"string","summary":"2-3 sentences","sentiment":"positive|negative|neutral"}]`
      );
      setNews(parseJSON(raw, true));
      setNSt("done");
    } catch (e) { setNErr(e.message); setNSt("error"); }
  }, []);

  const loadFilings = useCallback(async (sym) => {
    setFSt("loading"); setFErr("");
    try {
      const tr = await fetch("https://www.sec.gov/files/company_tickers.json");
      if (!tr.ok) throw new Error("SEC EDGAR unreachable");
      const tickers = await tr.json();
      let cikRaw = null, cName = null;
      for (const v of Object.values(tickers)) {
        if (v.ticker.toLowerCase() === sym.toLowerCase()) {
          cikRaw = v.cik_str; cName = v.title; break;
        }
      }
      if (!cikRaw) throw new Error(`${sym} not found in SEC EDGAR`);
      const cikPad = String(cikRaw).padStart(10, "0");
      const sr = await fetch(`https://data.sec.gov/submissions/CIK${cikPad}.json`);
      if (!sr.ok) throw new Error("Submissions fetch failed");
      const sub = await sr.json();
      const { form, filingDate, primaryDocument, accessionNumber } = sub.filings.recent;
      const list = [];
      for (let i = 0; i < form.length && list.length < 20; i++) {
        if (FORMS.includes(form[i])) {
          const acc = accessionNumber[i].replace(/-/g, "");
          list.push({
            form: form[i], date: filingDate[i], doc: primaryDocument[i],
            url: `https://www.sec.gov/Archives/edgar/data/${cikRaw}/${acc}/${primaryDocument[i]}`,
          });
        }
      }
      setFilings({ name: cName, cik: cikRaw, list });
      setFSt("done");
    } catch (e) { setFErr(e.message); setFSt("error"); }
  }, []);

  // ── Effects ──────────────────────────────────────────────────────────────────
  useEffect(() => {
    loadPrice("AAPL");
    loadChart("AAPL", "1y");
  }, []);

  useEffect(() => {
    if (tab === "news" && !news && nSt === "idle") loadNews(ticker);
    if (tab === "filings" && !filings && fSt === "idle") loadFilings(ticker);
  }, [tab]);

  // ── Handlers ─────────────────────────────────────────────────────────────────
  const handleSearch = () => {
    const sym = input.trim().toUpperCase();
    if (!sym) return;
    setTicker(sym);
    setPrice(null); setChart(null); setNews(null); setFilings(null);
    setPSt("idle"); setCSt("idle"); setNSt("idle"); setFSt("idle");
    setPErr(""); setCErr(""); setNErr(""); setFErr("");
    loadPrice(sym);
    loadChart(sym, range);
    if (tab === "news") loadNews(sym);
    if (tab === "filings") loadFilings(sym);
  };

  const handleRange = (r) => {
    setRange(r);
    loadChart(ticker, r);
  };

  // ── Chart Tooltip ─────────────────────────────────────────────────────────────
  const ChartTip = ({ active, payload, label }) => {
    if (!active || !payload?.length) return null;
    const meta = {
      price: { color: C.green, label: "Price" },
      ma20:  { color: C.amber,  label: "MA20"  },
      ma50:  { color: C.blue,   label: "MA50"  },
      ma200: { color: C.purple, label: "MA200" },
    };
    return (
      <div style={{ background: C.panel, border: `1px solid ${C.border}`, padding: "8px 12px", borderRadius: 4, fontSize: 11, fontFamily: "monospace" }}>
        <div style={{ color: C.muted, marginBottom: 6, letterSpacing: 1 }}>{label}</div>
        {payload.map(p => p.value != null && (
          <div key={p.dataKey} style={{ color: meta[p.dataKey]?.color || p.color, marginBottom: 2 }}>
            {meta[p.dataKey]?.label || p.dataKey}: <strong>${n(p.value)}</strong>
          </div>
        ))}
      </div>
    );
  };

  const priceUp = !price || price.change >= 0;
  const pColor = priceUp ? C.green : C.red;

  // ── Render ────────────────────────────────────────────────────────────────────
  return (
    <div style={{ fontFamily: "'Courier New',Courier,monospace", color: C.text, background: "#070710", minHeight: "100vh" }}>

      {/* ── Header ── */}
      <div style={{ borderBottom: `1px solid ${C.border}`, padding: "11px 18px", display: "flex", alignItems: "center", gap: 10, flexWrap: "wrap", background: "#08080f" }}>
        <span style={{ color: C.green, fontSize: 13, fontWeight: 700, letterSpacing: 4, marginRight: 6, whiteSpace: "nowrap" }}>◈ TERMINAL</span>
        <input
          value={input} maxLength={10} placeholder="TICKER"
          onChange={e => setInput(e.target.value.toUpperCase())}
          onKeyDown={e => e.key === "Enter" && handleSearch()}
          style={{ background: C.inp, border: `1px solid ${C.border}`, color: C.text, fontFamily: "inherit", fontSize: 13, padding: "5px 10px", borderRadius: 3, outline: "none", width: 90, letterSpacing: 2 }}
        />
        <button onClick={handleSearch}
          style={{ background: C.green, color: "#060610", border: "none", fontFamily: "inherit", fontSize: 10, fontWeight: 700, padding: "6px 14px", borderRadius: 3, cursor: "pointer", letterSpacing: 2 }}>
          FETCH →
        </button>
        {pSt === "loading" && (
          <span style={{ color: C.muted, fontSize: 10, letterSpacing: 2 }}>FETCHING...</span>
        )}
        {price && pSt === "done" && (
          <span style={{ fontSize: 11, color: C.muted }}>
            {ticker} · <span style={{ color: C.text }}>{price.name}</span> · {price.exchange}
          </span>
        )}
      </div>

      {/* ── Tabs ── */}
      <div style={{ display: "flex", borderBottom: `1px solid ${C.border}`, background: "#08080f", padding: "0 14px" }}>
        {["overview", "chart", "news", "filings"].map(t => (
          <button key={t} onClick={() => setTab(t)}
            style={{ padding: "10px 14px", fontSize: 10, letterSpacing: 2, cursor: "pointer", border: "none", background: "none", color: tab === t ? C.green : C.muted, borderBottom: tab === t ? `2px solid ${C.green}` : "2px solid transparent", fontFamily: "inherit" }}>
            {t.toUpperCase()}
          </button>
        ))}
      </div>

      <div style={{ padding: "16px 18px" }}>

        {/* ── OVERVIEW ── */}
        {tab === "overview" && <>
          {pSt === "error" && (
            <div style={{ color: C.red, fontSize: 11, padding: 12, background: "#1a0008", border: "1px solid #330011", borderRadius: 4, marginBottom: 12 }}>
              ⚠ {pErr}
            </div>
          )}
          {pSt === "loading" && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ FETCHING PRICE DATA...
            </div>
          )}
          {price && pSt === "done" && <>
            {/* Price Banner */}
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 4, padding: "14px 18px", marginBottom: 12 }}>
              <div style={{ fontSize: 9, color: C.muted, letterSpacing: 3, marginBottom: 8 }}>
                LAST PRICE · {price.sector || ""}
              </div>
              <div style={{ display: "flex", alignItems: "baseline", gap: 14, flexWrap: "wrap" }}>
                <span style={{ fontSize: 36, color: C.text, fontWeight: 300 }}>${n(price.price)}</span>
                <span style={{ fontSize: 16, color: pColor }}>
                  {price.change >= 0 ? "+" : ""}{n(price.change)} ({price.change >= 0 ? "+" : ""}{n(price.changePercent)}%)
                </span>
              </div>
            </div>
            {/* Stats Grid */}
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill,minmax(130px,1fr))", gap: 8, marginBottom: 14 }}>
              {[
                ["MARKET CAP",  price.marketCap],
                ["P/E RATIO",   price.peRatio],
                ["52W HIGH",    `$${n(price.high52w)}`],
                ["52W LOW",     `$${n(price.low52w)}`],
                ["VOLUME",      price.volume],
                ["AVG VOL",     price.avgVolume],
                ["BETA",        price.beta],
                ["EPS",         price.eps],
                ["DIV YIELD",   price.dividendYield],
              ].map(([label, val]) => (
                <div key={label} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 4, padding: "10px 12px" }}>
                  <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, marginBottom: 4 }}>{label}</div>
                  <div style={{ fontSize: 14, color: C.text }}>{val || "—"}</div>
                </div>
              ))}
            </div>
          </>}
        </>}

        {/* ── CHART ── */}
        {tab === "chart" && <>
          {/* Controls */}
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 14, flexWrap: "wrap" }}>
            {/* Range buttons */}
            <div style={{ display: "flex", gap: 4 }}>
              {RANGES.map(r => (
                <button key={r} onClick={() => handleRange(r)}
                  style={{ padding: "3px 10px", fontSize: 10, fontFamily: "inherit", letterSpacing: 1, cursor: "pointer", borderRadius: 3, border: `1px solid ${range === r ? C.green : C.border}`, background: range === r ? "#003316" : C.inp, color: range === r ? C.green : C.muted }}>
                  {r.toUpperCase()}
                </button>
              ))}
            </div>
            <div style={{ width: 1, height: 18, background: C.border, margin: "0 4px" }} />
            {/* MA toggles */}
            {[["ma20", C.amber, "MA20"], ["ma50", C.blue, "MA50"], ["ma200", C.purple, "MA200"]].map(([key, color, label]) => (
              <button key={key} onClick={() => setShowMA(m => ({ ...m, [key]: !m[key] }))}
                style={{ display: "inline-flex", alignItems: "center", gap: 5, padding: "3px 10px", background: showMA[key] ? `${color}18` : C.inp, border: `1px solid ${showMA[key] ? color : C.border}`, borderRadius: 3, cursor: "pointer", fontSize: 10, color: showMA[key] ? color : C.muted, fontFamily: "inherit", letterSpacing: 1 }}>
                ● {label}
              </button>
            ))}
          </div>

          {cSt === "error" && (
            <div style={{ color: C.red, fontSize: 11, padding: 12, background: "#1a0008", border: "1px solid #330011", borderRadius: 4, marginBottom: 12 }}>
              ⚠ {cErr}
              <button onClick={() => loadChart(ticker, range)}
                style={{ marginLeft: 10, color: C.green, background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 10 }}>
                RETRY
              </button>
            </div>
          )}
          {cSt === "loading" && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ LOADING CHART DATA...
            </div>
          )}
          {chart && cSt === "done" && (
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 4, padding: "16px 4px 0" }}>
              <ResponsiveContainer width="100%" height={360}>
                <ComposedChart data={chart} margin={{ top: 4, right: 16, bottom: 0, left: 8 }}>
                  <CartesianGrid strokeDasharray="2 4" stroke="#16162a" vertical={false} />
                  <XAxis dataKey="date"
                    tick={{ fontSize: 10, fill: C.muted, fontFamily: "monospace" }}
                    tickLine={false} axisLine={false}
                    interval={Math.max(0, Math.floor(chart.length / 7) - 1)} />
                  <YAxis domain={["auto", "auto"]}
                    tick={{ fontSize: 10, fill: C.muted, fontFamily: "monospace" }}
                    tickLine={false} axisLine={false}
                    tickFormatter={v => `$${v}`} width={54} />
                  <Tooltip content={<ChartTip />} />
                  <Area dataKey="price" name="price" fill="rgba(0,230,118,0.07)" stroke={C.green} strokeWidth={1.5} dot={false} />
                  {showMA.ma20  && <Line dataKey="ma20"  name="ma20"  stroke={C.amber}  strokeWidth={1.5} dot={false} connectNulls />}
                  {showMA.ma50  && <Line dataKey="ma50"  name="ma50"  stroke={C.blue}   strokeWidth={1.5} dot={false} connectNulls />}
                  {showMA.ma200 && <Line dataKey="ma200" name="ma200" stroke={C.purple} strokeWidth={1.5} dot={false} connectNulls />}
                </ComposedChart>
              </ResponsiveContainer>
              {/* MA current values */}
              <div style={{ display: "flex", gap: 16, padding: "10px 16px", borderTop: `1px solid ${C.border}`, fontSize: 11, flexWrap: "wrap" }}>
                {[["MA20", "ma20", C.amber], ["MA50", "ma50", C.blue], ["MA200", "ma200", C.purple]].map(([label, key, color]) => {
                  const last = [...chart].reverse().find(d => d[key] != null);
                  return (
                    <span key={key} style={{ color }}>
                      {label}: <strong>${last ? n(last[key]) : "—"}</strong>
                    </span>
                  );
                })}
                <span style={{ color: C.muted }}>
                  Current: <strong style={{ color: C.green }}>${n(chart[chart.length - 1]?.price)}</strong>
                </span>
              </div>
            </div>
          )}
        </>}

        {/* ── NEWS ── */}
        {tab === "news" && <>
          {nSt === "error" && (
            <div style={{ color: C.red, fontSize: 11, padding: 12, background: "#1a0008", border: "1px solid #330011", borderRadius: 4, marginBottom: 12 }}>
              ⚠ {nErr}
              <button onClick={() => loadNews(ticker)}
                style={{ marginLeft: 10, color: C.green, background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 10 }}>
                RETRY
              </button>
            </div>
          )}
          {nSt === "loading" && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ SEARCHING NEWS...
            </div>
          )}
          {nSt === "idle" && !news && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ READY — ENTER A TICKER AND CLICK FETCH
            </div>
          )}
          {news && nSt === "done" && news.map((item, i) => {
            const sc = item.sentiment === "positive"
              ? { bg: "#002e14", border: "#004d20", color: C.green }
              : item.sentiment === "negative"
              ? { bg: "#1a0008", border: "#330011", color: C.red }
              : { bg: "#101020", border: C.border, color: C.muted };
            return (
              <div key={i} style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 4, padding: 14, marginBottom: 10 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 8 }}>
                  <span style={{ fontSize: 9, padding: "2px 7px", borderRadius: 2, letterSpacing: 1, background: sc.bg, color: sc.color, border: `1px solid ${sc.border}` }}>
                    {(item.sentiment || "neutral").toUpperCase()}
                  </span>
                  <span style={{ fontSize: 10, color: C.muted }}>{item.source} · {item.date}</span>
                </div>
                <div style={{ fontSize: 13, color: C.text, lineHeight: 1.5, marginBottom: 6 }}>{item.title}</div>
                <div style={{ fontSize: 11, color: C.muted, lineHeight: 1.7 }}>{item.summary}</div>
              </div>
            );
          })}
        </>}

        {/* ── FILINGS ── */}
        {tab === "filings" && <>
          {fSt === "error" && (
            <div style={{ color: C.red, fontSize: 11, padding: 12, background: "#1a0008", border: "1px solid #330011", borderRadius: 4, marginBottom: 12 }}>
              ⚠ {fErr}
              <button onClick={() => loadFilings(ticker)}
                style={{ marginLeft: 10, color: C.green, background: "none", border: "none", cursor: "pointer", fontFamily: "inherit", fontSize: 10 }}>
                RETRY
              </button>
            </div>
          )}
          {fSt === "loading" && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ QUERYING SEC EDGAR...
            </div>
          )}
          {fSt === "idle" && !filings && (
            <div style={{ color: C.muted, fontSize: 11, padding: 30, textAlign: "center", letterSpacing: 2 }}>
              ⬡ READY — ENTER A TICKER AND CLICK FETCH
            </div>
          )}
          {filings && fSt === "done" && (
            <div style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 4, padding: 16 }}>
              <div style={{ fontSize: 9, color: C.muted, letterSpacing: 2, marginBottom: 14 }}>
                {filings.name} · CIK {filings.cik} · {filings.list.length} FILINGS FOUND
              </div>
              {filings.list.map((f, i) => {
                const fc = FORM_C[f.form] || C.muted;
                return (
                  <div key={i} style={{ display: "flex", alignItems: "center", gap: 10, padding: "8px 0", borderBottom: "1px solid #111120" }}>
                    <span style={{ fontSize: 9, padding: "2px 8px", borderRadius: 2, background: `${fc}18`, color: fc, border: `1px solid ${fc}40`, letterSpacing: 1, fontWeight: 700, minWidth: 52, textAlign: "center", whiteSpace: "nowrap" }}>
                      {f.form}
                    </span>
                    <span style={{ fontSize: 10, color: C.muted, minWidth: 84 }}>{f.date}</span>
                    <span style={{ fontSize: 11, color: C.text, flex: 1 }}>{FORM_D[f.form] || f.form}</span>
                    <a href={f.url} target="_blank" rel="noopener noreferrer"
                      style={{ fontSize: 9, color: C.green, letterSpacing: 1, padding: "2px 8px", border: "1px solid #003316", borderRadius: 2, whiteSpace: "nowrap" }}>
                      VIEW →
                    </a>
                  </div>
                );
              })}
            </div>
          )}
        </>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<StockTerminal />);
</script>
</body>
</html>
