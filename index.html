<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Stock Terminal</title>
<script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
a{text-decoration:none;color:inherit}
body{font-family:'Courier New',Courier,monospace;background:#070710;color:#c8d0e0;min-height:100vh}

/* ── HEADER ── */
#header{background:#08080f;border-bottom:1px solid #1c1c30;padding:11px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{color:#00e676;font-size:13px;font-weight:700;letter-spacing:4px;margin-right:6px;white-space:nowrap}
#ticker-input{background:#101020;border:1px solid #1c1c30;color:#c8d0e0;font-family:inherit;font-size:13px;padding:5px 10px;border-radius:3px;outline:none;width:90px;letter-spacing:2px}
#ticker-input:focus{border-color:#00e676}
#fetch-btn{background:#00e676;color:#060610;border:none;font-family:inherit;font-size:10px;font-weight:700;padding:6px 14px;border-radius:3px;cursor:pointer;letter-spacing:2px}
#fetch-btn:hover{background:#33ff99}
#header-status{font-size:11px;color:#505068}

/* ── TABS ── */
#tabs{background:#08080f;border-bottom:1px solid #1c1c30;padding:0 14px;display:flex}
.tab-btn{padding:10px 14px;font-size:10px;letter-spacing:2px;cursor:pointer;border:none;background:none;color:#505068;border-bottom:2px solid transparent;font-family:inherit;transition:color .15s}
.tab-btn.active{color:#00e676;border-bottom:2px solid #00e676}

/* ── CONTENT ── */
#content{padding:16px 18px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* ── STATES ── */
.loading-msg{color:#505068;font-size:11px;padding:30px;text-align:center;letter-spacing:2px}
.error-box{color:#ff4466;font-size:11px;padding:12px;background:#1a0008;border:1px solid #330011;border-radius:4px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.retry-btn{color:#00e676;background:none;border:none;cursor:pointer;font-family:inherit;font-size:10px;letter-spacing:1px;white-space:nowrap;margin-left:12px}
.hidden{display:none!important}

/* ── OVERVIEW ── */
.card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:14px 18px;margin-bottom:12px}
.card-label{font-size:9px;color:#505068;letter-spacing:3px;margin-bottom:8px}
.price-big{font-size:36px;color:#c8d0e0;font-weight:300}
.price-change{font-size:16px;margin-left:14px}
.up{color:#00e676}.down{color:#ff4466}
#stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-bottom:14px}
.stat-card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:10px 12px}
.stat-label{font-size:9px;color:#505068;letter-spacing:2px;margin-bottom:4px}
.stat-value{font-size:14px;color:#c8d0e0}

/* ── CHART TOOLBAR ── */
#chart-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
#range-buttons{display:flex;gap:4px}
.range-btn{padding:3px 10px;font-size:10px;font-family:inherit;letter-spacing:1px;cursor:pointer;border-radius:3px;border:1px solid #1c1c30;background:#101020;color:#505068;transition:all .15s}
.range-btn.active{border-color:#00e676;background:#003316;color:#00e676}
.vdiv{width:1px;height:18px;background:#1c1c30;margin:0 2px;flex-shrink:0}
.ma-btn{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:3px;cursor:pointer;font-size:10px;font-family:inherit;letter-spacing:1px;border:1px solid;transition:all .15s}
.tool-btn{padding:3px 10px;font-size:10px;font-family:inherit;letter-spacing:1px;cursor:pointer;border-radius:3px;border:1px solid #1c1c30;background:#101020;color:#505068;transition:all .15s}
.tool-btn:hover{border-color:#505068;color:#c8d0e0}
.tool-btn.active-draw{border-color:#ffdd00;background:#ffdd0018;color:#ffdd00}
#color-swatches{display:flex;gap:5px;align-items:center}
.color-dot{width:13px;height:13px;border-radius:50%;cursor:pointer;border:2px solid transparent;flex-shrink:0;transition:transform .1s}
.color-dot:hover{transform:scale(1.2)}
.color-dot.selected{border-color:#fff}

/* ── DRAW HINT ── */
#draw-hint{font-size:10px;color:#ffdd00;letter-spacing:1px;padding:5px 10px;background:#ffdd0010;border:1px solid #ffdd0030;border-radius:3px;margin-bottom:10px;display:none}

/* ── CHART ── */
#chart-outer{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;overflow:hidden}
#chart-container{width:100%;height:460px}
#chart-container.crosshair-cur{cursor:crosshair}
#ma-footer{display:flex;gap:16px;padding:10px 16px;border-top:1px solid #1c1c30;font-size:11px;flex-wrap:wrap}

/* ── NEWS ── */
.news-card{background:#0d0d1a;border:1px solid #1c1c30;border-radius:4px;padding:14px;margin-bottom:10px}
.news-meta{font-size:10px;color:#505068;margin-bottom:7px}
.news-title{font-size:13px;color:#c8d0e0;line-height:1.5;margin-bottom:6px}
.news-desc{font-size:11px;color:#505068;line-height:1.7;margin-bottom:6px}
.news-link{font-size:9px;color:#00e676;letter-spacing:1px;padding:2px 8px;border:1px solid #003316;border-radius:2px}

/* ── FILINGS ── */
.fil-header{font-size:9px;color:#505068;letter-spacing:2px;margin-bottom:14px}
.filing-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #111120}
.form-badge{font-size:9px;padding:2px 8px;border-radius:2px;letter-spacing:1px;font-weight:700;min-width:52px;text-align:center;white-space:nowrap}
.filing-date{font-size:10px;color:#505068;min-width:84px}
.filing-desc{font-size:11px;color:#c8d0e0;flex:1}
.view-link{font-size:9px;color:#00e676;letter-spacing:1px;padding:2px 8px;border:1px solid #003316;border-radius:2px;white-space:nowrap}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <span class="logo">◈ TERMINAL</span>
  <input id="ticker-input" type="text" value="AAPL" maxlength="10" placeholder="TICKER" autocomplete="off" spellcheck="false"/>
  <button id="fetch-btn">FETCH →</button>
  <span id="header-status"></span>
</div>

<!-- TABS -->
<div id="tabs">
  <button class="tab-btn active" data-tab="overview">OVERVIEW</button>
  <button class="tab-btn" data-tab="chart">CHART</button>
  <button class="tab-btn" data-tab="news">NEWS</button>
  <button class="tab-btn" data-tab="filings">FILINGS</button>
</div>

<div id="content">

  <!-- ── OVERVIEW ── -->
  <div id="tab-overview" class="tab-panel active">
    <div id="ov-loading" class="loading-msg">⬡ FETCHING PRICE DATA...</div>
    <div id="ov-error" class="error-box hidden"><span id="ov-err-text"></span><button class="retry-btn" id="ov-retry">RETRY</button></div>
    <div id="ov-content" class="hidden">
      <div class="card">
        <div class="card-label" id="price-label">LAST PRICE</div>
        <div><span class="price-big" id="price-val">—</span><span class="price-change" id="price-chg">—</span></div>
      </div>
      <div id="stats-grid"></div>
    </div>
  </div>

  <!-- ── CHART ── -->
  <div id="tab-chart" class="tab-panel">
    <div id="ch-loading" class="loading-msg">⬡ LOADING CHART DATA...</div>
    <div id="ch-error" class="error-box hidden"><span id="ch-err-text"></span><button class="retry-btn" id="ch-retry">RETRY</button></div>
    <div id="ch-content" class="hidden">
      <!-- Toolbar -->
      <div id="chart-toolbar">
        <div id="range-buttons"></div>
        <div class="vdiv"></div>
        <button class="ma-btn" id="ma20-btn" data-ma="ma20" style="color:#ff9500;border-color:#ff9500;background:#ff950018">● MA20</button>
        <button class="ma-btn" id="ma50-btn" data-ma="ma50" style="color:#4488ff;border-color:#4488ff;background:#4488ff18">● MA50</button>
        <button class="ma-btn" id="ma200-btn" data-ma="ma200" style="color:#aa44ff;border-color:#aa44ff;background:#aa44ff18">● MA200</button>
        <div class="vdiv"></div>
        <button class="tool-btn" id="draw-btn">✏ DRAW LINE</button>
        <div id="color-swatches">
          <div class="color-dot selected" data-color="#ffdd00" style="background:#ffdd00" title="Yellow"></div>
          <div class="color-dot" data-color="#ff4466" style="background:#ff4466" title="Red"></div>
          <div class="color-dot" data-color="#00e676" style="background:#00e676" title="Green"></div>
          <div class="color-dot" data-color="#4488ff" style="background:#4488ff" title="Blue"></div>
          <div class="color-dot" data-color="#ffffff" style="background:#ffffff" title="White"></div>
        </div>
        <button class="tool-btn" id="undo-btn">↩ UNDO</button>
        <button class="tool-btn" id="clear-btn">✕ CLEAR</button>
      </div>
      <div id="draw-hint">● CLICK ON CHART TO SET POINT 1</div>
      <!-- Chart -->
      <div id="chart-outer">
        <div id="chart-container"></div>
        <div id="ma-footer">
          <span id="ma20-val" style="color:#ff9500">MA20: <strong>—</strong></span>
          <span id="ma50-val" style="color:#4488ff">MA50: <strong>—</strong></span>
          <span id="ma200-val" style="color:#aa44ff">MA200: <strong>—</strong></span>
          <span id="cur-val" style="color:#505068">Current: <strong style="color:#00e676">—</strong></span>
        </div>
      </div>
    </div>
  </div>

  <!-- ── NEWS ── -->
  <div id="tab-news" class="tab-panel">
    <div id="nw-idle" class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    <div id="nw-loading" class="loading-msg hidden">⬡ FETCHING NEWS...</div>
    <div id="nw-error" class="error-box hidden"><span id="nw-err-text"></span><button class="retry-btn" id="nw-retry">RETRY</button></div>
    <div id="nw-content"></div>
  </div>

  <!-- ── FILINGS ── -->
  <div id="tab-filings" class="tab-panel">
    <div id="fi-idle" class="loading-msg">⬡ READY — ENTER A TICKER AND CLICK FETCH</div>
    <div id="fi-loading" class="loading-msg hidden">⬡ QUERYING SEC EDGAR...</div>
    <div id="fi-error" class="error-box hidden"><span id="fi-err-text"></span><button class="retry-btn" id="fi-retry">RETRY</button></div>
    <div id="fi-content"></div>
  </div>

</div><!-- /content -->

<script>
// ══════════════════════════════════════════════
// CONSTANTS
// ══════════════════════════════════════════════
const RANGES = ['1m','3m','6m','1y','2y','5y'];
const YF_R   = {'1m':'1mo','3m':'3mo','6m':'6mo','1y':'1y','2y':'2y','5y':'5y'};
const YF_I   = {'1m':'1d','3m':'1d','6m':'1d','1y':'1d','2y':'1wk','5y':'1wk'};
const FORMS  = ['10-K','10-Q','8-K','DEF 14A','4','S-1','S-3'];
const FORM_D = {'10-K':'Annual Report','10-Q':'Quarterly Report','8-K':'Current Report',
                'DEF 14A':'Proxy Statement','4':'Insider Trade','S-1':'IPO Registration','S-3':'Shelf Registration'};
const FORM_C = {'10-K':'#4488ff','10-Q':'#00bcd4','8-K':'#ff9500',
                'DEF 14A':'#aa44ff','4':'#ff4466','S-1':'#00e676','S-3':'#44cc88'};
const MA_C   = {ma20:'#ff9500',ma50:'#4488ff',ma200:'#aa44ff'};

// ══════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════
const S = {
  ticker:'AAPL', range:'1y', tab:'overview',
  showMA:{ma20:true,ma50:true,ma200:true},
  lwChart:null, candleSeries:null, volSeries:null,
  maSeries:{ma20:null,ma50:null,ma200:null},
  allTimes:[],
  drawMode:false, drawColor:'#ffdd00', drawPoint1:null,
  trendlines:[],
  chartLoaded:false, newsLoaded:false, filingsLoaded:false,
};

// ══════════════════════════════════════════════
// DOM HELPERS
// ══════════════════════════════════════════════
const $   = id => document.getElementById(id);
const show = id => $( id)?.classList.remove('hidden');
const hide = id => $( id)?.classList.add('hidden');
const html = (id,h) => { const e=$(id); if(e) e.innerHTML=h; };

function fmt(v,d=2){
  if(v==null||isNaN(+v))return'—';
  return(+v).toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function fmtLarge(n){
  n=+n;
  if(n>=1e12)return(n/1e12).toFixed(2)+'T';
  if(n>=1e9) return(n/1e9).toFixed(2)+'B';
  if(n>=1e6) return(n/1e6).toFixed(2)+'M';
  return n.toLocaleString();
}
function calcMA(arr,p){
  return arr.map((_,i)=>{
    if(i<p-1)return null;
    return parseFloat((arr.slice(i-p+1,i+1).reduce((a,b)=>a+b,0)/p).toFixed(4));
  });
}

// ══════════════════════════════════════════════
// YAHOO FINANCE
// ══════════════════════════════════════════════
async function yfFetch(sym,interval,range){
  const path=`/v8/finance/chart/${sym}?interval=${interval}&range=${range}&includePrePost=false`;
  let lastErr;
  for(const host of['https://query1.finance.yahoo.com','https://query2.finance.yahoo.com']){
    try{
      const r=await fetch(host+path);
      if(!r.ok)throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){lastErr=e;}
  }
  throw lastErr||new Error('Yahoo Finance unavailable');
}

// ══════════════════════════════════════════════
// OVERVIEW
// ══════════════════════════════════════════════
async function loadPrice(sym){
  show('ov-loading');hide('ov-error');hide('ov-content');
  $('header-status').textContent='FETCHING...';
  try{
    const json=await yfFetch(sym,'1d','1y');
    const res=json.chart?.result?.[0];
    if(!res)throw new Error(`No data for "${sym}"`);
    const meta=res.meta;
    const closes=(res.indicators?.quote?.[0]?.close||[]).filter(c=>c!=null);
    const price=meta.regularMarketPrice??meta.chartPreviousClose;
    const prev=meta.chartPreviousClose??price;
    const chg=price-prev, chgPct=prev?(chg/prev)*100:0;
    const high52=closes.length?Math.max(...closes):null;
    const low52=closes.length?Math.min(...closes.filter(c=>c>0)):null;

    $('price-val').textContent=`$${fmt(price)}`;
    $('price-label').textContent=`LAST PRICE · ${meta.exchangeName||''}`;
    const ce=$('price-chg');
    ce.textContent=`${chg>=0?'+':''}${fmt(chg)} (${chg>=0?'+':''}${fmt(chgPct)}%)`;
    ce.className='price-change '+(chg>=0?'up':'down');

    const rows=[
      ['SYMBOL',meta.symbol||sym],['EXCHANGE',meta.exchangeName||'—'],
      ['52W HIGH',high52?`$${fmt(high52)}`:'—'],['52W LOW',low52?`$${fmt(low52)}`:'—'],
      ['VOLUME',meta.regularMarketVolume?fmtLarge(meta.regularMarketVolume):'—'],
      ['PREV CLOSE',`$${fmt(prev)}`],['CURRENCY',meta.currency||'—'],['TYPE',meta.instrumentType||'—'],
    ];
    try{
      const q=await fetch(`https://query2.finance.yahoo.com/v10/finance/quoteSummary/${sym}?modules=price,summaryDetail`);
      if(q.ok){
        const qd=await q.json();
        const pr=qd.quoteSummary?.result?.[0]?.price;
        const sd=qd.quoteSummary?.result?.[0]?.summaryDetail;
        if(pr?.marketCap?.fmt)   rows.push(['MARKET CAP',pr.marketCap.fmt]);
        if(sd?.trailingPE?.fmt)  rows.push(['P/E RATIO', sd.trailingPE.fmt]);
        if(sd?.beta?.fmt)        rows.push(['BETA',       sd.beta.fmt]);
        if(sd?.dividendYield?.fmt)rows.push(['DIV YIELD', sd.dividendYield.fmt]);
      }
    }catch(_){}

    html('stats-grid',rows.map(([l,v])=>`
      <div class="stat-card">
        <div class="stat-label">${l}</div>
        <div class="stat-value">${v||'—'}</div>
      </div>`).join(''));
    hide('ov-loading');show('ov-content');
    $('header-status').textContent=`${sym} · ${meta.exchangeName||''}`;
  }catch(e){
    hide('ov-loading');show('ov-error');
    $('ov-err-text').textContent=`⚠ ${e.message}`;
    $('header-status').textContent='ERROR';
  }
}

// ══════════════════════════════════════════════
// CHART — INIT LIGHTWEIGHT CHARTS INSTANCE
// ══════════════════════════════════════════════
function initChart(){
  if(S.lwChart)return;
  const container=$('chart-container');
  S.lwChart=LightweightCharts.createChart(container,{
    width:container.clientWidth,
    height:460,
    layout:{
      background:{type:'solid',color:'#0d0d1a'},
      textColor:'#c8d0e0',
      fontFamily:"'Courier New',Courier,monospace",
    },
    grid:{vertLines:{color:'#16162a'},horzLines:{color:'#16162a'}},
    crosshair:{mode:LightweightCharts.CrosshairMode.Normal},
    rightPriceScale:{borderColor:'#1c1c30'},
    timeScale:{borderColor:'#1c1c30',timeVisible:true,secondsVisible:false},
    handleScroll:true,handleScale:true,
  });

  // Responsive
  new ResizeObserver(()=>{
    if(S.lwChart) S.lwChart.applyOptions({width:$('chart-container').clientWidth});
  }).observe(container);

  // Drawing clicks
  S.lwChart.subscribeClick(param=>{
    if(!S.drawMode||!param.time||!param.point)return;
    const price=S.candleSeries?.coordinateToPrice(param.point.y);
    if(price==null||isNaN(price))return;
    if(!S.drawPoint1){
      S.drawPoint1={time:param.time,price};
      $('draw-hint').textContent='● POINT 1 SET — CLICK TO SET POINT 2';
    }else{
      commitTrendline(S.drawPoint1,{time:param.time,price});
      S.drawPoint1=null;
      $('draw-hint').textContent='● LINE DRAWN — CLICK TO SET NEXT POINT 1';
    }
  });
}

// ══════════════════════════════════════════════
// CHART — LOAD DATA
// ══════════════════════════════════════════════
async function loadChart(sym,range){
  exitDrawMode();
  clearAllTrendlines();
  hide('ch-content');hide('ch-error');
  show('ch-loading');
  try{
    const json=await yfFetch(sym,YF_I[range],YF_R[range]);
    const res=json.chart?.result?.[0];
    if(!res)throw new Error('No chart data returned');
    const ts=res.timestamp;
    const q=res.indicators.quote[0];
    if(!ts||!q)throw new Error('Malformed chart response');

    // Build OHLCV arrays
    const candles=[],closes=[],vols=[];
    for(let i=0;i<ts.length;i++){
      const o=q.open[i],h=q.high[i],l=q.low[i],c=q.close[i],v=q.volume[i];
      if(o==null||h==null||l==null||c==null)continue;
      candles.push({time:ts[i],open:o,high:h,low:l,close:c});
      closes.push(c);
      vols.push({time:ts[i],value:v||0,color:c>=o?'rgba(0,230,118,0.35)':'rgba(255,68,102,0.35)'});
    }
    if(!candles.length)throw new Error('No valid candle data');
    S.allTimes=candles.map(c=>c.time);

    // MA data
    const ma20v=calcMA(closes,20),ma50v=calcMA(closes,50),ma200v=calcMA(closes,200);
    const toSeries=(arr)=>candles.map((c,i)=>arr[i]!=null?{time:c.time,value:arr[i]}:null).filter(Boolean);

    // Init chart if needed
    initChart();

    // Remove old series
    [S.candleSeries,S.volSeries,...Object.values(S.maSeries)].forEach(s=>{
      if(s)try{S.lwChart.removeSeries(s);}catch(_){}
    });
    S.candleSeries=null;S.volSeries=null;S.maSeries={ma20:null,ma50:null,ma200:null};

    // Volume (bottom pane)
    S.volSeries=S.lwChart.addHistogramSeries({
      priceFormat:{type:'volume'},
      priceScaleId:'vol',
    });
    S.lwChart.priceScale('vol').applyOptions({
      scaleMargins:{top:0.85,bottom:0},
    });
    S.volSeries.setData(vols);

    // Candlestick
    S.candleSeries=S.lwChart.addCandlestickSeries({
      upColor:'#00e676',downColor:'#ff4466',
      borderUpColor:'#00e676',borderDownColor:'#ff4466',
      wickUpColor:'#00e676',wickDownColor:'#ff4466',
    });
    S.candleSeries.setData(candles);

    // MA series
    const maOpts=(color)=>({color,lineWidth:1.5,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    S.maSeries.ma20 =S.lwChart.addLineSeries(maOpts('#ff9500'));
    S.maSeries.ma50 =S.lwChart.addLineSeries(maOpts('#4488ff'));
    S.maSeries.ma200=S.lwChart.addLineSeries(maOpts('#aa44ff'));

    S.maSeries.ma20.setData(toSeries(ma20v));
    S.maSeries.ma50.setData(toSeries(ma50v));
    S.maSeries.ma200.setData(toSeries(ma200v));
    S.maSeries.ma20.applyOptions({visible:S.showMA.ma20});
    S.maSeries.ma50.applyOptions({visible:S.showMA.ma50});
    S.maSeries.ma200.applyOptions({visible:S.showMA.ma200});

    // Footer values
    const last=arr=>[...arr].reverse().find(v=>v!=null);
    html('ma20-val', `<span style="color:#ff9500">MA20: <strong>$${fmt(last(ma20v))}</strong></span>`);
    html('ma50-val', `<span style="color:#4488ff">MA50: <strong>$${fmt(last(ma50v))}</strong></span>`);
    html('ma200-val',`<span style="color:#aa44ff">MA200: <strong>$${fmt(last(ma200v))}</strong></span>`);
    html('cur-val',  `<span style="color:#505068">Current: <strong style="color:#00e676">$${fmt(closes[closes.length-1])}</strong></span>`);

    S.lwChart.timeScale().fitContent();
    hide('ch-loading');show('ch-content');
    S.chartLoaded=true;
  }catch(e){
    hide('ch-loading');show('ch-error');
    $('ch-err-text').textContent=`⚠ ${e.message}`;
  }
}

// ══════════════════════════════════════════════
// DRAWING — TRENDLINES
// ══════════════════════════════════════════════
function commitTrendline(p1,p2){
  if(!S.lwChart||!S.allTimes.length)return;
  const [a,b]=p1.time<=p2.time?[p1,p2]:[p2,p1];
  const dt=b.time-a.time;
  const slope=dt?(b.price-a.price)/dt:0;
  const data=S.allTimes.map(t=>({time:t,value:parseFloat((a.price+slope*(t-a.time)).toFixed(6))}));
  const series=S.lwChart.addLineSeries({
    color:S.drawColor,lineWidth:1.5,
    priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,
    lineStyle:LightweightCharts.LineStyle.Solid,
  });
  series.setData(data);
  S.trendlines.push(series);
}

function undoLastTrendline(){
  if(!S.lwChart||!S.trendlines.length)return;
  try{S.lwChart.removeSeries(S.trendlines.pop());}catch(_){}
}

function clearAllTrendlines(){
  if(!S.lwChart)return;
  S.trendlines.forEach(s=>{try{S.lwChart.removeSeries(s);}catch(_){}});
  S.trendlines=[];
}

function exitDrawMode(){
  S.drawMode=false;S.drawPoint1=null;
  const btn=$('draw-btn'),hint=$('draw-hint'),cont=$('chart-container');
  if(btn){btn.classList.remove('active-draw');btn.textContent='✏ DRAW LINE';}
  if(hint)hint.style.display='none';
  if(cont)cont.classList.remove('crosshair-cur');
}

// ══════════════════════════════════════════════
// NEWS
// ══════════════════════════════════════════════
async function loadNews(sym){
  hide('nw-idle');hide('nw-error');html('nw-content','');
  show('nw-loading');
  try{
    const url=encodeURIComponent(`https://feeds.finance.yahoo.com/rss/2.0/headline?s=${sym}&region=US&lang=en-US`);
    const res=await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${url}&count=8`);
    if(!res.ok)throw new Error('News service unavailable');
    const data=await res.json();
    if(data.status!=='ok')throw new Error(data.message||'Could not load feed');
    const items=data.items||[];
    if(!items.length)throw new Error('No articles found for '+sym);
    hide('nw-loading');
    html('nw-content',items.map(item=>{
      const d=new Date(item.pubDate).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
      const desc=item.description?item.description.replace(/<[^>]*>/g,'').trim().slice(0,240)+'…':'';
      return`<div class="news-card">
        <div class="news-meta">${item.author||data.feed?.title||'Yahoo Finance'} · ${d}</div>
        <div class="news-title">${item.title}</div>
        ${desc?`<div class="news-desc">${desc}</div>`:''}
        <a href="${item.link}" target="_blank" rel="noopener noreferrer" class="news-link">READ →</a>
      </div>`;
    }).join(''));
    S.newsLoaded=true;
  }catch(e){
    hide('nw-loading');show('nw-error');
    $('nw-err-text').textContent=`⚠ ${e.message}`;
  }
}

// ══════════════════════════════════════════════
// FILINGS
// ══════════════════════════════════════════════
async function loadFilings(sym){
  hide('fi-idle');hide('fi-error');html('fi-content','');
  show('fi-loading');
  try{
    const tr=await fetch('https://www.sec.gov/files/company_tickers.json');
    if(!tr.ok)throw new Error('SEC EDGAR unreachable');
    const tickers=await tr.json();
    let cikRaw=null,cName=null;
    for(const v of Object.values(tickers)){
      if(v.ticker.toLowerCase()===sym.toLowerCase()){cikRaw=v.cik_str;cName=v.title;break;}
    }
    if(!cikRaw)throw new Error(`"${sym}" not found in SEC EDGAR`);
    const cikPad=String(cikRaw).padStart(10,'0');
    const sr=await fetch(`https://data.sec.gov/submissions/CIK${cikPad}.json`);
    if(!sr.ok)throw new Error('Submissions fetch failed');
    const sub=await sr.json();
    const{form,filingDate,primaryDocument,accessionNumber}=sub.filings.recent;
    const list=[];
    for(let i=0;i<form.length&&list.length<20;i++){
      if(FORMS.includes(form[i])){
        const acc=accessionNumber[i].replace(/-/g,'');
        list.push({form:form[i],date:filingDate[i],
          url:`https://www.sec.gov/Archives/edgar/data/${cikRaw}/${acc}/${primaryDocument[i]}`});
      }
    }
    hide('fi-loading');
    html('fi-content',`
      <div class="card" style="padding:16px">
        <div class="fil-header">${cName} · CIK ${cikRaw} · ${list.length} FILINGS</div>
        ${list.map(f=>{const fc=FORM_C[f.form]||'#505068';return`
          <div class="filing-row">
            <span class="form-badge" style="background:${fc}18;color:${fc};border:1px solid ${fc}40">${f.form}</span>
            <span class="filing-date">${f.date}</span>
            <span class="filing-desc">${FORM_D[f.form]||f.form}</span>
            <a href="${f.url}" target="_blank" rel="noopener noreferrer" class="view-link">VIEW →</a>
          </div>`;}).join('')}
      </div>`);
    S.filingsLoaded=true;
  }catch(e){
    hide('fi-loading');show('fi-error');
    $('fi-err-text').textContent=`⚠ ${e.message}`;
  }
}

// ══════════════════════════════════════════════
// SEARCH / FETCH
// ══════════════════════════════════════════════
function doFetch(){
  const sym=$('ticker-input').value.trim().toUpperCase();
  if(!sym)return;
  S.ticker=sym;S.chartLoaded=false;S.newsLoaded=false;S.filingsLoaded=false;
  loadPrice(sym);
  if(S.tab==='chart')   loadChart(sym,S.range);
  if(S.tab==='news')    loadNews(sym);
  if(S.tab==='filings') loadFilings(sym);
}

// ══════════════════════════════════════════════
// INIT — RANGE BUTTONS
// ══════════════════════════════════════════════
RANGES.forEach(r=>{
  const b=document.createElement('button');
  b.className='range-btn'+(r===S.range?' active':'');
  b.textContent=r.toUpperCase();
  b.addEventListener('click',()=>{
    S.range=r;
    document.querySelectorAll('.range-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    loadChart(S.ticker,r);
  });
  $('range-buttons').appendChild(b);
});

// ══════════════════════════════════════════════
// INIT — MA TOGGLE BUTTONS
// ══════════════════════════════════════════════
document.querySelectorAll('.ma-btn').forEach(btn=>{
  const ma=btn.dataset.ma,col=MA_C[ma];
  btn.addEventListener('click',()=>{
    S.showMA[ma]=!S.showMA[ma];
    if(S.showMA[ma]){btn.style.color=col;btn.style.borderColor=col;btn.style.background=col+'18';}
    else{btn.style.color='#505068';btn.style.borderColor='#1c1c30';btn.style.background='#101020';}
    if(S.maSeries[ma])S.maSeries[ma].applyOptions({visible:S.showMA[ma]});
  });
});

// ══════════════════════════════════════════════
// INIT — DRAW BUTTON
// ══════════════════════════════════════════════
$('draw-btn').addEventListener('click',()=>{
  if(S.drawMode){
    exitDrawMode();
  }else{
    if(!S.chartLoaded)return;
    S.drawMode=true;S.drawPoint1=null;
    const btn=$('draw-btn'),hint=$('draw-hint'),cont=$('chart-container');
    btn.classList.add('active-draw');btn.textContent='✕ CANCEL DRAW';
    hint.style.display='block';hint.textContent='● CLICK ON CHART TO SET POINT 1';
    cont.classList.add('crosshair-cur');
  }
});

$('undo-btn').addEventListener('click',undoLastTrendline);
$('clear-btn').addEventListener('click',clearAllTrendlines);

// ══════════════════════════════════════════════
// INIT — COLOR SWATCHES
// ══════════════════════════════════════════════
document.querySelectorAll('.color-dot').forEach(dot=>{
  dot.addEventListener('click',()=>{
    document.querySelectorAll('.color-dot').forEach(d=>d.classList.remove('selected'));
    dot.classList.add('selected');
    S.drawColor=dot.dataset.color;
  });
});

// ══════════════════════════════════════════════
// INIT — TAB SWITCHING
// ══════════════════════════════════════════════
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click',()=>{
    const tab=btn.dataset.tab;
    S.tab=tab;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
    $('tab-'+tab).classList.add('active');
    if(tab==='chart'   &&!S.chartLoaded)  loadChart(S.ticker,S.range);
    if(tab==='news'    &&!S.newsLoaded)   loadNews(S.ticker);
    if(tab==='filings' &&!S.filingsLoaded)loadFilings(S.ticker);
  });
});

// ══════════════════════════════════════════════
// INIT — RETRY BUTTONS
// ══════════════════════════════════════════════
$('ov-retry').addEventListener('click',()=>loadPrice(S.ticker));
$('ch-retry').addEventListener('click',()=>loadChart(S.ticker,S.range));
$('nw-retry').addEventListener('click',()=>loadNews(S.ticker));
$('fi-retry').addEventListener('click',()=>loadFilings(S.ticker));

// ══════════════════════════════════════════════
// INIT — SEARCH INPUT
// ══════════════════════════════════════════════
$('fetch-btn').addEventListener('click',doFetch);
$('ticker-input').addEventListener('keydown',e=>{if(e.key==='Enter')doFetch();});

loadPrice('AAPL');
</script>
